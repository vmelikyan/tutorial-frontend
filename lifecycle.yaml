---
version: "2.1.0"
environment:
  autoDeploy: true
  defaultServices:
    - name: "tutorial-frontend"
  optionalServices:
    - name: "tutorial-backend"
      repository: "vmelikyan/tutorial-backend"
      branch: "github-type"
      
services:
  - name: tutorial-frontend
    defaultUUID: "tutorial-dev-0"
    github:
      repository: "vmelikyan/tutorial-frontend"
      branchName: "github-type"
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: "main"
        app:
          dockerfilePath: "Dockerfile"
          ports:
            - 3000
          env:
            COMPONENT: "app"
            ENV: "lifecycle"
            API_URL: "https://{{tutorial-backend_publicUrl}}"
            UUID: "{{buildUUID}}"
      deployment:
        public: true
        resource:
          cpu:
            request: '10m'
          memory:
            request: '50Mi'
        readiness:
          tcpSocketPort: 3000
        hostnames:
          host: '0env.com'
          defaultInternalHostname: 'tutorial-frontend-dev-0'
          defaultPublicUrl: 'tutorial-frontend-dev-0.0env.com'
